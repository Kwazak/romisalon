name: Build and Deploy RomiSalon

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USERNAME: ${{ secrets.VM_USERNAME }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false

      - name: 3. Setup Node.js v24 & Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 4. Install Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts --allow-build=esbuild --allow-build=@swc/core --allow-build=msw --allow-build=unrs-resolver --config.minimum-release-age=0

      - name: 5. Typecheck & Build Frontend + Backend
        env:
          PORT: "3000"
          BASE_PATH: "/"
        run: |
          pnpm run typecheck
          pnpm --filter @workspace/romi-salon run build
          pnpm --filter @workspace/api-server run build

      - name: 6. Package Artifacts (Frontend dist/public & Backend dist/index.mjs)
        run: |
          mkdir -p deploy_bundle/frontend deploy_bundle/backend

          # Mengambil isi dari dist/public/ milik romi-salon
          cp -r artifacts/romi-salon/dist/public/* deploy_bundle/frontend/

          # Mengambil hasil bundle dist/ dan package.json milik api-server
          cp -r artifacts/api-server/dist deploy_bundle/backend/
          cp artifacts/api-server/package.json deploy_bundle/backend/

          # Bungkus menjadi 1 file tar.gz
          tar -czf release.tar.gz -C deploy_bundle .

      - name: 7. Simpan Artifact Build di GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: romisalon-release-bundle
          path: release.tar.gz
          retention-days: 7

      - name: 8. Siapkan Direktori di VM Debian (Jika Secret VM Dikonfigurasi)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p /var/www/romisalon/frontend /var/www/romisalon/backend

      - name: 9. Upload release.tar.gz ke VM (Jika Secret VM Dikonfigurasi)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "release.tar.gz"
          target: "/var/www/romisalon"

      - name: 10. Extract & Restart PM2 di VM Debian (Jika Secret VM Dikonfigurasi)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /var/www/romisalon

            # Bersihkan file frontend lama & ekstrak rilis baru
            rm -rf /var/www/romisalon/frontend/*
            tar -xzf release.tar.gz -C /var/www/romisalon
            rm -f release.tar.gz

            # Pastikan Nginx (www-data) bisa membaca seluruh folder dan file frontend
            chmod -R 755 /var/www/romisalon/frontend

            # Pastikan file .env ada dan memiliki PORT=5000 default
            cd /var/www/romisalon/backend
            touch .env
            grep -q "^PORT=" .env || echo "PORT=5000" >> .env

            # Jalankan Backend dengan Node v24 + PM2
            PORT=5000 pm2 describe romisalon-api > /dev/null 2>&1 \
              && PORT=5000 pm2 reload romisalon-api --update-env \
              || PORT=5000 pm2 start dist/index.mjs --name "romisalon-api" --node-args="--env-file-if-exists=.env"

            pm2 save
